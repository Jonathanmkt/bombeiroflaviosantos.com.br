<style>
  :root{
    --azul-fundo:#08152b;
    --azul-topo:#102a52;
    --amarelo:#f5a524;
    --vermelho:#d92d20;
    --texto:#eef3fb;
    --texto-suave:#9db0cc;
    --borda:rgba(255,255,255,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100dvh;
    display:flex;align-items:center;justify-content:center;
    padding:clamp(24px,6vw,64px) 20px;
    font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    color:var(--texto);
    background:
      radial-gradient(1100px 600px at 50% -12%, var(--azul-topo) 0%, transparent 62%),
      linear-gradient(180deg, #0a1830 0%, var(--azul-fundo) 55%, #060f20 100%);
    background-color:var(--azul-fundo);
    text-align:center;
  }
  main{width:100%;max-width:560px}

  .retrato{
    width:132px;height:132px;margin:0 auto 26px;
    border-radius:50%;
    padding:4px;
    background:linear-gradient(140deg,var(--amarelo),var(--vermelho));
    box-shadow:0 18px 42px rgba(0,0,0,.5);
  }
  .retrato img{
    width:100%;height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
    border:3px solid var(--azul-fundo);
    background:var(--azul-topo);
  }

  /* O cargo pretendido e o titulo de maior peso; o nome vem logo abaixo.
     Mesmo desenho ja adotado no site do Fabio Arruda. */
  h1{
    /* nome civil completo e longo: escala menor que a de um nome de campanha,
       senao quebra em tres linhas no telefone */
    font-size:clamp(26px,6.2vw,38px);
    line-height:1.16;
    font-weight:800;
    letter-spacing:-.02em;
  }
  h1 .primeiro{
    display:block;
    font-size:.48em;
    font-weight:700;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--amarelo);
    margin-bottom:10px;
  }

  .numero{
    margin:32px auto 0;
    display:block;
    width:fit-content;
    padding:18px clamp(24px,7vw,40px);
    border-radius:16px;
    background:linear-gradient(140deg,var(--amarelo),#e08c12);
    color:#1b1205;
    box-shadow:0 16px 38px rgba(0,0,0,.45);
  }
  .numero .rotulo{
    display:block;
    font-size:11px;font-weight:700;
    letter-spacing:.22em;text-transform:uppercase;
    opacity:.72;
  }
  .numero .digitos{
    display:block;
    margin-top:4px;
    font-size:clamp(40px,12vw,60px);
    font-weight:800;
    line-height:1;
    letter-spacing:.04em;
    font-variant-numeric:tabular-nums;
  }

  .partido{
    margin-top:26px;
    font-size:clamp(14px,3.6vw,16px);
    line-height:1.6;
    color:var(--texto-suave);
  }
  .partido strong{color:var(--texto);font-weight:600}

  footer{
    margin-top:40px;
    padding-top:20px;
    border-top:1px solid var(--borda);
    font-size:12px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--texto-suave);
  }
  footer .responsavel{
    display:block;margin-top:8px;
    text-transform:none;letter-spacing:.01em;
    font-size:12.5px;line-height:1.5;
    color:var(--texto-suave);
  }
</style>
</head>
<body>
<main>
  <div class="retrato">
    <img src="assets/flavio.jpg" alt="Retrato de Flávio Henrique Pinto dos Santos" width="132" height="132">
  </div>

  <h1><span class="primeiro">Deputado Estadual</span>Flávio Henrique<br>Pinto dos Santos</h1>

  <p class="numero">
    <span class="rotulo">Número</span>
    <span class="digitos">10193</span>
  </p>

  <p class="partido">
    <strong>Republicanos</strong> — São Paulo
  </p>

  <footer>
    <span class="responsavel">Site e anúncios de responsabilidade de Flávio Henrique Pinto dos Santos<br>
    CNPJ da campanha 68.461.977/0001-40</span>
  </footer>
</main>
</body>
</html>
